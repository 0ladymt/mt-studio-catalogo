name: MT Studio — integridade da loja
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar site e mídias
        run: node scripts/check-site.mjs
